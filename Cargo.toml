[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/arbrume/arbrume"
rust-version = "1.90"

[workspace.dependencies]
arbrume-core = { path = "crates/arbrume-core" }
arbrume-grow = { path = "crates/arbrume-grow" }
arbrume-mesh = { path = "crates/arbrume-mesh" }
arbrume-export = { path = "crates/arbrume-export" }
arbrume-gen = { path = "crates/arbrume-gen" }
arbrume-raster = { path = "crates/arbrume-raster" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
