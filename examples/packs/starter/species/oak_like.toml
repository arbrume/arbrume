# Oak-like broadleaf tree: a stout trunk that soon divides into heavy, crooked limbs
# reaching far out, under a broad dome wider than it is tall.
#
# Typical size at age 60: about 13 m tall, crown 17 m wide, trunk 0.7 m across at the
# base. Every value is a starting point chosen by eye, not a measurement.

schema_version = 0
name = "Oak-like broadleaf"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 3
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
axis_length = { by_order = [
    8.5,
    { points = [[0.0, 2.0], [0.25, 6.0], [0.4, 8.5], [0.75, 7.0], [1.0, 5.0]], interp = "smooth" },
    [[0.0, 0.8], [0.3, 2.6], [1.0, 1.4]],
    [[0.0, 0.4], [0.5, 0.7], [1.0, 0.4]],
] }
shoot_length = { by_order = [[[0.0, 0.35], [1.0, 0.1]], [[0.0, 0.4], [1.0, 0.15]], 0.28, 0.2] }
length_variation = 0.22
internode_length = { by_order = [0.3, 0.4, 0.28, 0.16] }
branch_probability = { by_order = [0.7, [[0.0, 0.0], [0.15, 0.55], [1.0, 0.7]], 0.4] }
bare_base = { by_order = [0.3, 0.0, 0.0] }
branching_angle = { by_order = [50.0, [[0.0, 72.0], [0.6, 62.0], [1.0, 40.0]], 60.0, 55.0] }
branching_angle_variation = 12.0
direction_variation = { by_order = [1.5, 6.0, 9.0, 6.0] }
gnarl = { by_order = [2.5, 18.0, 18.0, 8.0] }
gravitropic_setpoint = { by_order = [0.0, 58.0, 70.0, 80.0] }
tropism_weight = { by_order = [0.1, 0.04, 0.03, 0.02] }
fork_probability = { by_order = [[[0.0, 0.0], [0.5, 0.0], [0.55, 0.25], [0.8, 0.25], [0.85, 0.0]], 0.0] }
fork_limit = 2
fork_angle = 30.0

[geometry]
radius_model = "pipe"
pipe_exponent = 1.8
tip_radius = 0.007
flare = 0.8

[foliage]
length = 0.14
width_ratio = 0.55
shape = "obovate"
segments = 2
inclination_deg = 50.0
retention_cycles = 4
density = 0.5
per_node = 2
color = [0.065, 0.18, 0.035]
hue_variation = 0.1
brightness_variation = 0.35
twig = { leaves = 7, length = 0.24, inclination_deg = 50.0, bend_deg = 10.0, stem_radius = 0.0025 }
venation = { veins = 5, angle_deg = 50.0 }
margin = { kind = "lobed", depth = 0.45 }

[bark]
color = [0.1, 0.09, 0.078]
young_color = [0.12, 0.09, 0.06]
young_radius = 0.05
color_variation = 0.2
pattern = { kind = "furrowed", feature_size = 0.05, stretch = 3.5, coverage = 0.45, relief = 0.8, contrast = 0.35 }

[variation]
age = [30, 70]
scale = [0.85, 1.2]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branch_probability" = 0.1
"growth.branching_angle" = 0.12
"growth.gravitropic_setpoint" = 0.1
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
