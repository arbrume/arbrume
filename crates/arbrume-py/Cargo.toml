[package]
name = "arbrume-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings of Arbrume (PyO3, abi3)"
publish = false

[lints]
workspace = true

# The extension module is tested from Python (`tests/`, pytest); there is no Rust test
# harness to link against libpython.
[lib]
name = "_arbrume"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
arbrume-core.workspace = true
arbrume-export.workspace = true
arbrume-fit.workspace = true
arbrume-forest.workspace = true
arbrume-gen.workspace = true
arbrume-pack.workspace = true
bytemuck = "1.23"
glam = "0.34.3"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
rayon = "1.10"
serde_json = "1.0"
toml = "1.2.1"
