# Cypress-like columnar conifer: a hidden trunk closely wrapped in short upright branches
# and dense dark sprays, in a narrow flame from the ground to a pointed tip.
#
# Typical size at age 30: about 12 m tall, 3 m wide, trunk 0.25 m across at the base.
# Every value is a starting point chosen by eye, not a measurement. A twig is one spray
# of scale-leaved shoots.

schema_version = 0
name = "Cypress-like columnar conifer"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 2
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
axis_length = { by_order = [
    13.0,
    { points = [[0.0, 2.6], [0.4, 2.4], [0.8, 1.6], [1.0, 0.7]], interp = "smooth" },
    [[0.0, 0.5], [1.0, 0.8]],
] }
shoot_length = { by_order = [[[0.0, 0.5], [1.0, 0.25]], 0.22, 0.2] }
length_variation = 0.15
internode_length = { by_order = [0.16, 0.2, 0.2] }
branch_probability = { by_order = [0.9, [[0.0, 0.0], [0.2, 0.5], [1.0, 0.6]]] }
bare_base = { by_order = [0.02, 0.0] }
branching_angle = { by_order = [0.0, [[0.0, 34.0], [1.0, 24.0]], 30.0] }
branching_angle_variation = 5.0
direction_variation = { by_order = [0.5, 3.0, 4.0] }
gnarl = { by_order = [1.0, 5.0, 6.0] }
gravitropic_setpoint = { by_order = [0.0, 3.0, 8.0] }
tropism_weight = { by_order = [0.1, 0.14, 0.1] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.012
child_radius_exponent = 1.3
taper = [[0.0, 1.0], [1.0, 0.06]]
flare = 0.5

[foliage]
length = 0.07
width_ratio = 0.28
shape = "lanceolate"
segments = 2
fold_deg = 0.0
curvature_deg = 0.0
petiole_length = 0.0
inclination_deg = 32.0
retention_cycles = 12
per_node = 2
color = [0.035, 0.105, 0.05]
hue_variation = 0.08
brightness_variation = 0.4
size_variation = 0.2
twig = { leaves = 9, length = 0.3, inclination_deg = 30.0, bend_deg = -10.0, stem_radius = 0.0025, radial = true, fins = 2, fin_width = 0.03, fin_shade = 0.7, variants = 5 }

[bark]
color = [0.15, 0.12, 0.1]
young_color = [0.14, 0.09, 0.05]
young_radius = 0.02
color_variation = 0.1

[variation]
age = [10, 40]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
