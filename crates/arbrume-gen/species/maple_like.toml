# Maple-like broadleaf tree: a short clear trunk, ascending scaffold branches and a wide
# rounded crown of broad leaves.
#
# Typical size at age 40: about 13 m tall, crown 12 m wide, trunk 0.4 m across at the
# base. Every value is a starting point chosen by eye, not a measurement.

schema_version = 0
name = "Maple-like broadleaf"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 3
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
# Scaffold branches are longest in the lower half of the crown and stay long to the top.
axis_length = { by_order = [
    10.0,
    { points = [[0.0, 1.5], [0.2, 4.2], [0.35, 5.8], [0.7, 5.2], [1.0, 3.6]], interp = "smooth" },
    [[0.0, 0.7], [0.35, 2.0], [1.0, 1.1]],
    [[0.0, 0.35], [0.5, 0.55], [1.0, 0.35]],
] }
shoot_length = { by_order = [[[0.0, 0.5], [1.0, 0.18]], [[0.0, 0.45], [1.0, 0.2]], 0.3, 0.2] }
length_variation = 0.2
internode_length = { by_order = [0.32, 0.4, 0.24, 0.14] }
branch_probability = { by_order = [0.65, [[0.0, 0.0], [0.15, 0.65], [1.0, 0.75]], 0.5] }
bare_base = { by_order = [0.2, 0.0, 0.0] }
branching_angle = { by_order = [50.0, [[0.0, 78.0], [0.6, 58.0], [1.0, 32.0]], 55.0, 50.0] }
branching_angle_variation = 10.0
direction_variation = { by_order = [2.0, 5.0, 8.0, 6.0] }
gnarl = { by_order = [5.0, 14.0, 16.0, 8.0] }
gravitropic_setpoint = { by_order = [0.0, 50.0, 70.0, 80.0] }
tropism_weight = { by_order = [0.08, 0.05, 0.03, 0.02] }
fork_probability = { by_order = [[[0.0, 0.0], [0.45, 0.0], [0.5, 0.2], [0.7, 0.2], [0.75, 0.0]], 0.0] }
fork_limit = 1
fork_angle = 24.0

[geometry]
radius_model = "pipe"
pipe_exponent = 1.85
tip_radius = 0.006
flare = 0.6

[foliage]
length = 0.14
width_ratio = 0.95
shape = "ovate"
segments = 2
inclination_deg = 55.0
retention_cycles = 3
density = 0.6
per_node = 2
color = [0.1, 0.26, 0.04]
hue_variation = 0.12
brightness_variation = 0.35
twig = { leaves = 6, length = 0.26, inclination_deg = 55.0, bend_deg = 20.0, stem_radius = 0.002 }

[bark]
color = [0.15, 0.125, 0.105]
young_color = [0.13, 0.085, 0.05]
young_radius = 0.04
color_variation = 0.15

[variation]
age = [18, 50]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branch_probability" = 0.1
"growth.branching_angle" = 0.12
"growth.gravitropic_setpoint" = 0.1
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
