# Sapling: a young broadleaf tree a few years old, a thin whip with a handful of short
# side branches and large leaves.
#
# Typical size at age 5: about 2.5 m tall, 1.6 m wide, stem 3 cm across at the base.
# Every value is a starting point chosen by eye, not a measurement.

schema_version = 0
name = "Broadleaf sapling"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 2
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
axis_length = { by_order = [
    5.0,
    [[0.0, 0.9], [0.4, 1.3], [1.0, 0.5]],
    [[0.0, 0.25], [1.0, 0.4]],
] }
shoot_length = { by_order = [[[0.0, 0.55], [1.0, 0.4]], 0.3, 0.2] }
length_variation = 0.25
internode_length = { by_order = [0.09, 0.08, 0.07] }
branch_probability = { by_order = [[[0.0, 0.0], [0.08, 0.3], [1.0, 0.4]], 0.25] }
branching_angle = { by_order = [50.0, [[0.0, 65.0], [1.0, 40.0]], 50.0] }
branching_angle_variation = 10.0
direction_variation = { by_order = [2.0, 5.0, 6.0] }
gnarl = { by_order = [5.0, 10.0, 10.0] }
gravitropic_setpoint = { by_order = [0.0, 45.0, 70.0] }
tropism_weight = { by_order = [0.1, 0.05, 0.03] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.0065
child_radius_exponent = 1.0
taper = [[0.0, 1.0], [1.0, 0.15]]
flare = 0.3

[foliage]
length = 0.11
width_ratio = 0.6
shape = "ovate"
segments = 4
inclination_deg = 55.0
retention_cycles = 2
color = [0.11, 0.3, 0.05]
hue_variation = 0.12
brightness_variation = 0.3

[bark]
color = [0.14, 0.11, 0.08]
young_color = [0.16, 0.19, 0.07]
young_radius = 0.012
color_variation = 0.1

[variation]
age = [3, 8]
scale = [0.8, 1.2]
weight = 0.6

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branch_probability" = 0.1
"growth.branching_angle" = 0.12
"growth.gravitropic_setpoint" = 0.1
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
