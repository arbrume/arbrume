# Vine-like climber, self-organizing with tendrils: a stem rises from the foot of a
# post or a pergola, its tendrils coil around the thin parts of the support, its shoots
# run along the beams and hang between them. Tendrils hold only supports thinner than
# max_support_thickness; on a wall it sprawls and hangs. On open ground it creeps.
#
# Typical size at age 10 on a pergola: about 3 m tall and 4 m wide. Every value is a
# starting point chosen by eye, not a measurement.

schema_version = 0
name = "Vine-like climber"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 5
phyllotaxis = { leaves_per_node = 1, divergence_deg = 180.0 }

[growth]
mode = "self_organizing"
environment_weight = 0.4
axis_length = { by_order = [6.0, 5.0, 3.5, 2.0, 1.2] }
shoot_length = { by_order = [1.2, 1.0, 0.8, 0.6] }
length_variation = 0.15
internode_length = { by_order = [0.13, 0.12, 0.11, 0.1] }
branch_probability = { by_order = [[[0.0, 0.1], [0.25, 0.7], [1.0, 0.7]], 0.65] }
branching_angle = { by_order = [45.0, 50.0, 50.0, 50.0] }
branching_angle_variation = 15.0
direction_variation = { by_order = [6.0, 9.0, 10.0] }
gnarl = { by_order = [16.0, 20.0, 20.0] }
gravitropic_setpoint = { by_order = [0.0, 75.0, 85.0, 90.0] }
tropism_weight = { by_order = [0.25, 0.12, 0.08, 0.06] }

[growth.self_organization]
sensing = "shadow"
allocation = "borchert_honda"
axis_bias = 0.52
resource_coefficient = 6.0
shadow_cell = 2.0
shadow_strength = 0.07
shadow_depth = 4
shedding_threshold = 0.006
bud_lifespan = 5

[geometry]
radius_model = "pipe"
pipe_exponent = 2.7
tip_radius = 0.0025
flare = 0.2
radial_segments = [3, 12]

[foliage]
length = 0.14
width_ratio = 1.0
shape = "ovate"
segments = 2
inclination_deg = 65.0
retention_cycles = 5
density = 0.9
per_node = 1
color = [0.07, 0.17, 0.035]
hue_variation = 0.1
brightness_variation = 0.3
venation = { kind = "palmate", veins = 2, angle_deg = 60.0 }
margin = { kind = "lobed", depth = 0.25 }
texture_resolution = 256

[bark]
color = [0.22, 0.15, 0.1]
young_color = [0.2, 0.2, 0.09]
young_radius = 0.006
color_variation = 0.15
texture_resolution = 256
pattern = { kind = "fibrous", feature_size = 0.006, stretch = 7.0, relief = 0.5, coverage = 0.5 }

[climbing]
attachment = "tendril"
reach = 0.12
search_distance = 0.7
seek_weight = 0.5
gap = 0.008
droop = 80.0
ground = true
max_support_thickness = 0.25
tendrils = 0.2
tendril_length = 0.16
tendril_turns = 3.5
leaf_facing = 0.6

[variation]
age = [6, 14]
scale = [0.9, 1.1]
weight = 0.0

[variation.jitter]
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.self_organization.resource_coefficient" = 0.1
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
