# Generic conifer, fir-like: a straight trunk with regular whorls of level branches that
# carry flat sprays of foliage, in a tidy, dense cone.
#
# Typical size at age 40: about 16 m tall, crown 6.5 m wide at the base, trunk 0.3 m
# across. Every value is a starting point chosen by eye, not a measurement. A twig is
# one flat side shoot; its needles are drawn larger and fewer than the real ones.

schema_version = 0
name = "Generic conifer"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "rhythmic"
branch_timing = "proleptic"
max_order = 1
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[[architecture.axes]]
orientation = "orthotropic"

[[architecture.axes]]
orientation = "plagiotropic"
phyllotaxis = { leaves_per_node = 2, divergence_deg = 180.0 }

[growth]
axis_length = { by_order = [17.0, 3.5] }
apical_dominance = 0.95
shoot_length = { by_order = [[[0.0, 0.5], [1.0, 0.28]], [[0.0, 0.3], [1.0, 0.15]]] }
length_variation = { by_order = [0.05, 0.08] }
internode_length = { by_order = [0.25, 0.16] }
branch_probability = 1.0
unit_branching = [[0.0, 0.0], [0.99, 0.0], [1.0, 1.0]]
whorl = { by_order = [5.0, 0.0] }
bare_base = { by_order = [0.05, 0.0] }
branching_angle = { by_order = [0.0, [[0.0, 92.0], [0.6, 80.0], [1.0, 60.0]]] }
branching_angle_variation = 4.0
direction_variation = { by_order = [0.5, 1.5] }
gnarl = { by_order = [0.0, 3.0] }
gravitropic_setpoint = { by_order = [0.0, 85.0] }
tropism_weight = { by_order = [0.1, 0.03] }
curvature = { by_order = [0.0, [[0.0, 10.0], [1.0, -25.0]]] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.0105
child_radius_exponent = 1.3
taper = [[0.0, 1.0], [1.0, 0.06]]
flare = 0.35

# A twig is one side shoot held flat: a stem, one level fin and two ranks of needles.
[foliage]
length = 0.04
width_ratio = 0.3
shape = "needle"
segments = 1
petiole_length = 0.0
inclination_deg = 55.0
size_along_axis = [[0.0, 0.5], [0.25, 1.0], [0.7, 0.75], [1.0, 0.3]]
retention_cycles = 16
per_node = 2
density = 1.0
color = [0.03, 0.115, 0.07]
hue_variation = 0.08
brightness_variation = 0.35
size_variation = 0.2
orientation_variation_deg = 12.0
twig = { leaves = 12, length = 0.38, leaves_per_node = 2, divergence_deg = 0.0, inclination_deg = 60.0, bend_deg = 20.0, stem_radius = 0.004, terminal_leaf = false, fins = 2, fin_width = 0.032, fin_shade = 0.75, variants = 4 }
texture_variants = 2
texture_resolution = 256
venation = { kind = "none" }

[bark]
color = [0.17, 0.155, 0.14]
young_color = [0.16, 0.12, 0.08]
young_radius = 0.03
color_variation = 0.12
pattern = { kind = "plated", feature_size = 0.06, stretch = 1.8, coverage = 0.3, contrast = 0.4, relief = 0.6 }

[variation]
age = [10, 50]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
