# Upright shrub: a clump of tall canes rising steeply from the ground and fanning a
# little at the top, lilac-like, with broad leaves on short side shoots.
#
# Typical size at age 10: about 4.5 m tall and 3.5 m wide. Every value is a starting
# point chosen by eye, not a measurement.

schema_version = 0
name = "Upright multi-stem shrub"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 2
phyllotaxis = { leaves_per_node = 2, divergence_deg = 90.0 }

[growth]
stems = 8
stem_spread = 0.18
stem_angle = 13.0
axis_length = { by_order = [
    3.6,
    [[0.0, 0.5], [0.5, 1.2], [1.0, 0.9]],
    [[0.0, 0.3], [1.0, 0.45]],
] }
shoot_length = { by_order = [[[0.0, 0.7], [1.0, 0.2]], 0.3, 0.2] }
length_variation = 0.25
internode_length = { by_order = [0.16, 0.13, 0.1] }
branch_probability = { by_order = [[[0.0, 0.0], [0.3, 0.1], [0.5, 0.4], [1.0, 0.5]], 0.3] }
branching_angle = { by_order = [14.0, 38.0, 45.0] }
branching_angle_variation = 8.0
direction_variation = { by_order = [3.0, 5.0, 6.0] }
gnarl = { by_order = [8.0, 10.0, 10.0] }
gravitropic_setpoint = { by_order = [[[0.0, 0.0], [1.0, 25.0]], 25.0, 40.0] }
tropism_weight = { by_order = [0.06, 0.07, 0.05] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.0075
child_radius_exponent = 1.1
taper = [[0.0, 1.0], [1.0, 0.15]]
flare = 0.3

[foliage]
length = 0.075
width_ratio = 0.7
shape = "ovate"
segments = 2
inclination_deg = 55.0
retention_cycles = 3
density = 0.8
color = [0.085, 0.23, 0.05]
hue_variation = 0.1
brightness_variation = 0.3
twig = { leaves = 4, length = 0.1, leaves_per_node = 2, divergence_deg = 90.0, inclination_deg = 55.0, bend_deg = 10.0, stem_radius = 0.0015, terminal_leaf = false }

[bark]
color = [0.15, 0.13, 0.11]
young_color = [0.17, 0.15, 0.08]
young_radius = 0.012
color_variation = 0.12

[variation]
age = [4, 16]
scale = [0.75, 1.25]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
