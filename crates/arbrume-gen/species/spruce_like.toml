# Spruce-like conifer: a straight trunk, whorls of branches that sweep down and turn up at
# the tip, hanging branchlets and a narrow conical crown down to the ground.
#
# Typical size at age 40: about 18 m tall, crown 8.5 m wide at the base, trunk 0.35 m
# across. Every value is a starting point chosen by eye, not a measurement. A twig is
# one hanging branchlet; its needles are drawn larger and fewer than the real ones.

schema_version = 0
name = "Spruce-like conifer"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "rhythmic"
branch_timing = "proleptic"
max_order = 1
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[[architecture.axes]]
orientation = "orthotropic"

[[architecture.axes]]
orientation = "plagiotropic"
phyllotaxis = { leaves_per_node = 2, divergence_deg = 180.0 }

[growth]
axis_length = { by_order = [19.0, 4.4] }
apical_dominance = 0.92
shoot_length = { by_order = [[[0.0, 0.55], [1.0, 0.3]], [[0.0, 0.4], [1.0, 0.18]]] }
length_variation = { by_order = [0.05, 0.12] }
internode_length = { by_order = [0.27, 0.17] }
# The trunk branches in the whorl that ends each growth unit.
branch_probability = 1.0
unit_branching = [[0.0, 0.0], [0.99, 0.0], [1.0, 1.0]]
whorl = { by_order = [4.0, 0.0] }
branching_angle = { by_order = [0.0, [[0.0, 100.0], [0.6, 80.0], [1.0, 55.0]]] }
branching_angle_variation = 6.0
direction_variation = { by_order = [0.5, 2.0] }
gnarl = { by_order = [0.0, 6.0] }
gravitropic_setpoint = { by_order = [0.0, 100.0] }
tropism_weight = { by_order = [0.1, 0.03] }
curvature = { by_order = [0.0, [[0.0, 25.0], [0.6, 0.0], [1.0, -60.0]]] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.0105
child_radius_exponent = 1.3
taper = [[0.0, 1.0], [1.0, 0.06]]
flare = 0.4

# A twig is one hanging branchlet: a stem, three fins for the bulk of its needles and a
# fringe of enlarged needles.
[foliage]
length = 0.035
width_ratio = 0.25
shape = "needle"
segments = 1
petiole_length = 0.0
inclination_deg = 60.0
size_along_axis = [[0.0, 0.5], [0.3, 1.0], [0.7, 0.8], [1.0, 0.3]]
retention_cycles = 14
per_node = 2
density = 0.75
color = [0.035, 0.11, 0.05]
hue_variation = 0.1
brightness_variation = 0.4
size_variation = 0.25
orientation_variation_deg = 14.0
twig = { leaves = 12, length = 0.65, inclination_deg = 50.0, bend_deg = 50.0, stem_radius = 0.004, terminal_leaf = false, radial = true, fins = 3, fin_width = 0.035, fin_shade = 0.75, variants = 5 }

[bark]
color = [0.16, 0.10, 0.075]
young_color = [0.2, 0.12, 0.06]
young_radius = 0.03
color_variation = 0.15

[variation]
age = [12, 50]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
