# Generic shrub: a rounded, dense bush of many stems from the ground, twiggy to the
# outside, with small leaves.
#
# Typical size at age 8: about 2 m tall and 3 m wide. Every value is a starting point
# chosen by eye, not a measurement.

schema_version = 0
name = "Generic shrub"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 2
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
stems = 9
stem_spread = 0.12
stem_angle = 28.0
axis_length = { by_order = [
    1.5,
    [[0.0, 0.5], [0.4, 0.95], [1.0, 0.6]],
    [[0.0, 0.25], [1.0, 0.4]],
] }
shoot_length = { by_order = [[[0.0, 0.4], [1.0, 0.12]], 0.25, 0.18] }
length_variation = 0.25
internode_length = { by_order = [0.1, 0.09, 0.07] }
branch_probability = { by_order = [[[0.0, 0.0], [0.2, 0.5], [1.0, 0.7]], 0.45] }
branching_angle = { by_order = [20.0, 50.0, 55.0] }
branching_angle_variation = 14.0
direction_variation = { by_order = [5.0, 8.0, 8.0] }
gnarl = { by_order = [14.0, 18.0, 14.0] }
gravitropic_setpoint = { by_order = [20.0, 55.0, 70.0] }
tropism_weight = { by_order = [0.05, 0.04, 0.03] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.012
child_radius_exponent = 1.1
taper = [[0.0, 1.0], [1.0, 0.15]]
flare = 0.2

[foliage]
length = 0.045
width_ratio = 0.55
shape = "elliptic"
segments = 2
inclination_deg = 50.0
retention_cycles = 4
density = 0.7
per_node = 2
color = [0.07, 0.2, 0.04]
hue_variation = 0.12
brightness_variation = 0.35
twig = { leaves = 6, length = 0.1, inclination_deg = 50.0, bend_deg = 10.0, stem_radius = 0.0012 }
texture_resolution = 256

[bark]
color = [0.13, 0.1, 0.075]
young_color = [0.15, 0.11, 0.06]
young_radius = 0.01
color_variation = 0.15
texture_resolution = 256
pattern = { kind = "fibrous", feature_size = 0.008, stretch = 6.0, relief = 0.4, coverage = 0.4 }

[variation]
age = [4, 14]
scale = [0.7, 1.3]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
