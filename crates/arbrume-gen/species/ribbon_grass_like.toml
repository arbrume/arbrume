# Ribbon-grass-like plant: a tape grass. Runners on the bottom give off rosettes of
# long, thin, slightly twisted ribbon leaves that rise through the water; the tips of
# the longest reach the surface and lie on it.
#
# Typical size at age 8 in 0.9 m of water: a patch of about 25 rosettes, 1.5 to 2 m
# across, ribbons up to 1.2 m. Every value is a starting point chosen by eye, not a
# measurement; the habit follows the descriptions cited in docs/underwater.md.

schema_version = 0
name = "Ribbon-grass-like plant"

[architecture]
branching = "monopodial"
growth_rhythm = "continuous"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 0
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
stems = 1
axis_length = 0.04
shoot_length = 0.02
internode_length = 0.008
branch_probability = 0.0
direction_variation = 4.0
gravitropic_setpoint = 0.0
tropism_weight = 0.1

[geometry]
radius_model = "tapered"
radius_ratio = 0.06
taper = [[0.0, 1.0], [1.0, 0.8]]
flare = 0.0
collar_flare = 0.0
radial_segments = [3, 5]

[foliage]
length = 0.95
width_ratio = 0.011
shape = "strap"
segments = 16
fold_deg = 0.0
curvature_deg = 30.0
twist_deg = 160.0
undulation = 0.15
undulation_waves = 5.0
petiole_length = 0.0
inclination_deg = 12.0
per_node = 2
retention_cycles = 30
size_along_axis = [[0.0, 0.5], [1.0, 1.0]]
color = [0.2, 0.38, 0.08]
roughness = 0.35
hue_variation = 0.1
brightness_variation = 0.25
size_variation = 0.25
orientation_variation_deg = 5.0
texture_resolution = 128
venation = { kind = "parallel", veins = 3 }

[bark]
color = [0.25, 0.3, 0.12]
roughness = 0.5
texture_resolution = 32
pattern = { kind = "smooth", feature_size = 0.005, coverage = 0.0, relief = 0.05 }

[aquatic]
water_depth = 0.9
buoyancy = 0.4
stiffness = 2.0e6
stem_buoyancy = 0.0
leaf_lift = 0.4
leaf_flex = 0.6

[aquatic.rhizome]
axes = 3
spacing = 0.22
extension = 1
branch_probability = 0.25
branch_angle_deg = 60.0
wander_deg = 15.0
max_order = 1
radius = 0.003
burial = 0.2
max_ramets = 28

[variation]
age = [5, 12]
scale = [0.8, 1.2]
weight = 0.0

[variation.jitter]
"foliage.length" = 0.2
"foliage.color" = 0.12
