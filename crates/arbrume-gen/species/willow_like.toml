# Willow-like weeping broadleaf tree: a short trunk, arching limbs and long thin
# branchlets that hang straight down in curtains of narrow leaves.
#
# Typical size at age 30: about 12 m tall, crown 12 m wide, trunk 0.4 m across at the
# base. Every value is a starting point chosen by eye, not a measurement.

schema_version = 0
name = "Willow-like weeping broadleaf"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 3
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
axis_length = { by_order = [
    7.5,
    { points = [[0.0, 4.5], [0.4, 6.5], [1.0, 5.0]], interp = "smooth" },
    [[0.0, 1.5], [0.4, 3.2], [1.0, 3.6]],
    [[0.0, 0.8], [1.0, 2.2]],
] }
shoot_length = { by_order = [[[0.0, 0.45], [1.0, 0.15]], [[0.0, 0.55], [1.0, 0.25]], 0.6, 0.6] }
length_variation = 0.25
internode_length = { by_order = [0.3, 0.45, 0.4, 0.34] }
branch_probability = { by_order = [0.75, [[0.0, 0.0], [0.2, 0.6], [1.0, 0.85]], 0.25] }
bare_base = { by_order = [0.3, 0.0, 0.0] }
branching_angle = { by_order = [50.0, [[0.0, 70.0], [0.6, 50.0], [1.0, 35.0]], 65.0, 50.0] }
branching_angle_variation = 10.0
direction_variation = { by_order = [3.0, 6.0, 4.0, 3.0] }
gnarl = { by_order = [5.0, 16.0, 8.0, 4.0] }
# Limbs arch up and over; what they bear falls.
gravitropic_setpoint = { by_order = [0.0, [[0.0, 40.0], [1.0, 100.0]], 178.0, 180.0] }
tropism_weight = { by_order = [0.06, 0.05, 0.3, 0.35] }
fork_probability = { by_order = [[[0.0, 0.0], [0.45, 0.0], [0.5, 0.3], [0.8, 0.3], [0.85, 0.0]], 0.0] }
fork_limit = 1
fork_angle = 30.0

[geometry]
radius_model = "pipe"
pipe_exponent = 1.75
tip_radius = 0.007
flare = 0.7

[foliage]
length = 0.17
width_ratio = 0.3
shape = "lanceolate"
segments = 2
fold_deg = 10.0
inclination_deg = 35.0
retention_cycles = 8
density = 0.6
per_node = 2
color = [0.12, 0.27, 0.05]
hue_variation = 0.12
brightness_variation = 0.3
twig = { leaves = 9, length = 0.7, inclination_deg = 40.0, bend_deg = 30.0, stem_radius = 0.0015 }

[bark]
color = [0.13, 0.11, 0.09]
young_color = [0.26, 0.21, 0.05]
young_radius = 0.025
color_variation = 0.15

[variation]
age = [24, 50]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branch_probability" = 0.1
"growth.branching_angle" = 0.12
"growth.gravitropic_setpoint" = 0.1
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
