# Larch-like deciduous conifer: a straight trunk, level limbs with thin hanging
# branchlets, and soft light-green needles in small tufts, in an airy cone.
#
# Typical size at age 40: about 18 m tall, crown 8 m wide, trunk 0.4 m across at the
# base. Every value is a starting point chosen by eye, not a measurement. A twig is one
# hanging branchlet set with tufts of needles.

schema_version = 0
name = "Larch-like conifer"

[architecture]
