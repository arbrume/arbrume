# Generic broadleaf tree: a straight trunk carried into an egg-shaped, dense crown that
# starts low, in the manner of a linden.
#
# Typical size at age 40: about 15 m tall, crown 10 m wide, trunk 0.45 m across at the
# base. Every value is a starting point chosen by eye, not a measurement.

schema_version = 0
name = "Generic broadleaf"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 3
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
# The order 1 curve draws the egg: widest at one third of the height.
axis_length = { by_order = [
    15.0,
    { points = [[0.0, 1.2], [0.13, 2.8], [0.3, 4.4], [0.7, 3.2], [1.0, 1.2]], interp = "smooth" },
    [[0.0, 0.6], [0.4, 1.5], [1.0, 0.8]],
    0.4,
] }
shoot_length = { by_order = [[[0.0, 0.6], [1.0, 0.2]], [[0.0, 0.4], [1.0, 0.18]], 0.28, 0.2] }
length_variation = 0.15
internode_length = { by_order = [0.3, 0.36, 0.24, 0.14] }
branch_probability = { by_order = [0.8, [[0.0, 0.0], [0.12, 0.7], [1.0, 0.8]], 0.5] }
bare_base = { by_order = [0.13, 0.0, 0.0] }
branching_angle = { by_order = [50.0, [[0.0, 85.0], [0.5, 60.0], [1.0, 35.0]], 55.0, 50.0] }
branching_angle_variation = 8.0
direction_variation = { by_order = [1.5, 4.0, 7.0, 6.0] }
gnarl = { by_order = [3.0, 10.0, 14.0, 8.0] }
gravitropic_setpoint = { by_order = [0.0, 60.0, 80.0, 90.0] }
tropism_weight = { by_order = [0.1, 0.04, 0.03, 0.02] }
curvature = { by_order = [0.0, [[0.0, 25.0], [0.5, 0.0], [1.0, -30.0]], 0.0] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.015
child_radius_exponent = 1.2
taper = [[0.0, 1.0], [0.7, 0.45], [1.0, 0.1]]
flare = 0.5

[foliage]
length = 0.13
width_ratio = 0.85
shape = "ovate"
segments = 2
inclination_deg = 55.0
retention_cycles = 4
density = 0.85
per_node = 2
color = [0.07, 0.21, 0.04]
hue_variation = 0.1
brightness_variation = 0.35
twig = { leaves = 6, length = 0.24, divergence_deg = 180.0, inclination_deg = 60.0, bend_deg = 25.0, stem_radius = 0.002 }

[bark]
color = [0.13, 0.115, 0.1]
young_color = [0.12, 0.08, 0.05]
young_radius = 0.04
color_variation = 0.12

[variation]
age = [14, 50]
scale = [0.85, 1.15]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branch_probability" = 0.1
"growth.branching_angle" = 0.12
"growth.gravitropic_setpoint" = 0.1
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
