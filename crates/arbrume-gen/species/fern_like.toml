# Fern-like plant: a shuttlecock of arching fronds from the ground, each a midrib with
# two ranks of feathered pinnae that shorten to a point.
#
# Typical size at age 2: about 0.8 m tall and 1.6 m wide. Every value is a starting
# point chosen by eye, not a measurement. Each frond is a stem; its pinnae are compound
# leaves.

schema_version = 0
name = "Fern-like plant"

[architecture]
branching = "monopodial"
growth_rhythm = "continuous"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 0

[[architecture.axes]]
orientation = "plagiotropic"
phyllotaxis = { leaves_per_node = 2, divergence_deg = 180.0 }

[growth]
stems = 11
stem_spread = 0.04
stem_angle = 22.0
axis_length = 1.0
shoot_length = 0.55
length_variation = 0.25
internode_length = 0.04
branch_probability = 0.0
branching_angle_variation = 12.0
direction_variation = 1.0
gnarl = 4.0
tropism_weight = 0.0
curvature = 55.0

[geometry]
radius_model = "tapered"
radius_ratio = 0.005
taper = [[0.0, 1.0], [1.0, 0.2]]
flare = 0.0
radial_segments = [3, 6]

[foliage]
length = 0.2
width_ratio = 0.3
shape = "lanceolate"
segments = 2
fold_deg = 5.0
curvature_deg = 30.0
petiole_length = 0.0
leaflet_pairs = 5
leaflet_angle_deg = 65.0
inclination_deg = 72.0
size_along_axis = [[0.0, 0.0], [0.12, 0.25], [0.3, 1.0], [0.7, 0.75], [1.0, 0.12]]
retention_cycles = 6
color = [0.09, 0.26, 0.05]
hue_variation = 0.08
brightness_variation = 0.25
size_variation = 0.08
orientation_variation_deg = 6.0

[bark]
color = [0.12, 0.2, 0.05]
color_variation = 0.1

[variation]
age = [2, 4]
scale = [0.6, 1.4]
weight = 0.7

[variation.jitter]
"growth.axis_length" = 0.2
"growth.stems" = 0.3
"growth.stem_angle" = 0.25
"growth.curvature" = 0.25
"foliage.length" = 0.12
"foliage.color" = 0.1
