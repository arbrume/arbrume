# Low spreading shrub: stems that leave the ground at a low angle and run outwards,
# with short rising side branches and small dark leaves, wider than tall.
#
# Typical size at age 8: about 1.1 m tall and 4 m wide. Every value is a starting point
# chosen by eye, not a measurement.

schema_version = 0
name = "Low spreading shrub"

[architecture]
branching = "monopodial"
growth_rhythm = "rhythmic"
branching_pattern = "diffuse"
branch_timing = "proleptic"
max_order = 2
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[[architecture.axes]]
orientation = "plagiotropic"
phyllotaxis = { leaves_per_node = 2, divergence_deg = 180.0 }

[growth]
stems = 9
stem_spread = 0.08
stem_angle = 55.0
axis_length = { by_order = [
    1.7,
    [[0.0, 0.3], [0.3, 0.75], [1.0, 0.35]],
    [[0.0, 0.15], [1.0, 0.25]],
] }
shoot_length = { by_order = [[[0.0, 0.4], [1.0, 0.15]], 0.25, 0.15] }
length_variation = 0.25
internode_length = { by_order = [0.12, 0.1, 0.08] }
branch_probability = { by_order = [[[0.0, 0.0], [0.15, 0.6], [1.0, 0.75]], 0.4] }
branching_angle = { by_order = [20.0, 55.0, 55.0] }
branching_angle_variation = 20.0
direction_variation = { by_order = [4.0, 6.0, 6.0] }
gnarl = { by_order = [12.0, 14.0, 10.0] }
# Stems arch: up a little at first, then level, tips slightly raised.
gravitropic_setpoint = { by_order = [[[0.0, 60.0], [0.6, 90.0], [1.0, 72.0]], 55.0, 70.0] }
tropism_weight = { by_order = [0.12, 0.08, 0.05] }

[geometry]
radius_model = "tapered"
radius_ratio = 0.009
child_radius_exponent = 1.1
taper = [[0.0, 1.0], [1.0, 0.15]]
flare = 0.0

[foliage]
length = 0.04
width_ratio = 0.6
shape = "elliptic"
segments = 2
fold_deg = 20.0
inclination_deg = 55.0
retention_cycles = 6
density = 0.6
per_node = 2
color = [0.045, 0.14, 0.04]
hue_variation = 0.1
brightness_variation = 0.35
twig = { leaves = 8, length = 0.13, leaves_per_node = 2, divergence_deg = 0.0, inclination_deg = 55.0, bend_deg = 5.0, stem_radius = 0.001, terminal_leaf = false }
texture_resolution = 256

[bark]
color = [0.14, 0.09, 0.07]
young_color = [0.2, 0.09, 0.06]
young_radius = 0.008
color_variation = 0.15
texture_resolution = 256
pattern = { kind = "fibrous", feature_size = 0.008, stretch = 6.0, relief = 0.4, coverage = 0.4 }

[variation]
age = [4, 12]
scale = [0.7, 1.3]

[variation.jitter]
"growth.axis_length" = 0.15
"growth.internode_length" = 0.08
"growth.branching_angle" = 0.1
"growth.gravitropic_setpoint" = 0.08
"growth.gnarl" = 0.3
"growth.curvature" = 0.25
"geometry.radius_ratio" = 0.15
"foliage.length" = 0.1
"foliage.color" = 0.1
"bark.color" = 0.08
