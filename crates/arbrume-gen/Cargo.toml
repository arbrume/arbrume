[package]
name = "arbrume-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
arbrume-core.workspace = true
arbrume-grow.workspace = true
arbrume-mesh.workspace = true
arbrume-lod.workspace = true
arbrume-texture.workspace = true
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
arbrume-export.workspace = true
criterion = { version = "0.5", default-features = false }
glam = "0.34.3"
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
arbrume-raster.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "engine"
harness = false
