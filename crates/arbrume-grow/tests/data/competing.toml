# Test fixture of the self-organizing mode: a small tree whose buds compete for light,
# with shedding and a bud lifespan. Values are chosen to exercise every stage in a few
# cycles, not to look like a species.

schema_version = 0
name = "Competing tree"

[architecture]
max_order = 4
phyllotaxis = { leaves_per_node = 1, divergence_deg = 137.5 }

[growth]
mode = "self_organizing"
environment_weight = 0.15
axis_length = { by_order = [9.0, 5.0, 3.0, 1.5, 1.0] }
shoot_length = { by_order = [0.8, 0.6, 0.5, 0.4] }
length_variation = 0.1
internode_length = { by_order = [0.3, 0.3, 0.28, 0.25] }
branch_probability = 0.7
branching_angle = { by_order = [50.0, 60.0, 55.0, 50.0] }
branching_angle_variation = 10.0
direction_variation = { by_order = [2.0, 5.0, 7.0, 7.0] }
gnarl = { by_order = [3.0, 8.0, 10.0, 8.0] }
gravitropic_setpoint = { by_order = [0.0, 60.0, 75.0, 80.0] }
tropism_weight = { by_order = [0.1, 0.03, 0.02, 0.02] }

[growth.self_organization]
axis_bias = 0.52
shedding_threshold = 0.04
bud_lifespan = 3

[geometry]
radius_model = "pipe"
pipe_exponent = 2.2
tip_radius = 0.006

[foliage]
retention_cycles = 2
per_node = 2
