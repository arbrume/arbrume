name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - run: python3 tools/check_comments.py .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tools --no-package-lock --no-audit --no-fund
      - run: mkdir -p "$RUNNER_TEMP/glb"
      - run: cargo run -p arbrume-export --example sample_glb -- "$RUNNER_TEMP/glb/sample.glb"
      - run: cargo test -p arbrume-export
        env:
          ARBRUME_GLB_OUT: ${{ runner.temp }}/glb
      - run: node tools/validate_glb.mjs "$RUNNER_TEMP/glb"
      - name: Generate every preset with the command line
        run: |
          cargo build -p arbrume
          for species in $(target/debug/arbrume species list | cut -f1); do
            target/debug/arbrume gen --species "$species" --count 2 --seed 1 \
              --age-range 8..20 --lods 2 --out "$RUNNER_TEMP/presets" --quiet
          done
      - run: node tools/validate_glb.mjs "$RUNNER_TEMP/presets"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.x
      - name: Build the abi3 wheel
        working-directory: crates/arbrume-py
        run: uvx maturin build --release --out "$RUNNER_TEMP/wheels"
      - name: Build the command line, for the glb comparison test
        run: cargo build --release -p arbrume
      - name: Test the same wheel on Python 3.11 and the newest 3.x
        working-directory: crates/arbrume-py
        env:
          ARBRUME_CLI: ${{ github.workspace }}/target/release/arbrume
        run: |
          for python in python3.11 python; do
            venv="$RUNNER_TEMP/venv-$python"
            uv venv --python "$(command -v "$python")" "$venv"
            uv pip install --python "$venv/bin/python" "$RUNNER_TEMP"/wheels/*.whl pytest
            "$venv/bin/python" --version
            "$venv/bin/python" -m pytest -v tests
          done
